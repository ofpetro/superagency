// Apply tiebreaker adjustments to raw data
const data=stories.map((s,si)=>{
  const arr=[...s.slice(2)];
  for(let fi=0;fi<20;fi++){
    const key=`${si}-${fi}`;
    if(tbFlags[key]==="+") arr[fi]=Math.min(3,arr[fi]+1);
    else if(tbFlags[key]==="-") arr[fi]=Math.max(0,arr[fi]-1);
  }
  return arr;
});

function buildTable(filteredIndices){
  const mat=document.getElementById('mat');

  });
  hdr.innerHTML+=`<th class="agg">Row<br>total</th><th style="color:var(--color-text-secondary);font-size:9px">Max</th>`;

  // story totals
  const stTotals=filteredIndices.map(()=>0);

  catOrder.forEach(cat=>{
    const catFeats=features.filter(f=>f.cat===cat);
    const catRow=document.createElement('tr');
    catRow.innerHTML=`<td colspan="${filteredIndices.length+3}" class="cat-hdr" style="background:${catColors[cat]}">${cat}. ${{"A":"Indicators","B":"Observation & info","C":"Agent-level mechanisms","D":"Technical & structural","E":"Population dynamics"}[cat]}</td>`;
    mat.appendChild(catRow);

    catFeats.forEach(feat=>{
      const fi=features.indexOf(feat);
      const row=document.createElement('tr');
      let cells=`<td class="feat" style="background:${catColors[cat]}"><div class="fn">${feat.id} ${feat.name}</div></td>`;
      let rowSum=0;
      filteredIndices.forEach((si,idx)=>{
        const v=data[si][fi];
        const tb=tbFlags[`${si}-${fi}`];
        const cl=v===0?'s0':v===1?'s1':v===2?'s2':'s3';
        cells+=`<td class="${cl}${tb?' tb':''}" title="${stories[si][0]}: ${feat.id}=${v}${tb?' (tiebreaker '+tb+'1)':''}">${v}</td>`;
        rowSum+=v;
        stTotals[idx]+=v;
      });
      cells+=`<td class="agg">${rowSum}</td><td style="color:var(--color-text-secondary);font-size:9px">${3*filteredIndices.length}</td>`;
      row.innerHTML=cells;
      mat.appendChild(row);
    });
  });

  // totals row
  const totRow=document.createElement('tr');
  totRow.innerHTML='<td class="feat agg"><div class="fn">Story total</div></td>';
  stTotals.forEach(t=>{
    totRow.innerHTML+=`<td class="agg" style="font-size:10px">${t}</td>`;
  });
  const grandTotal=stTotals.reduce((a,b)=>a+b,0);
  totRow.innerHTML+=`<td class="agg">${grandTotal}</td><td style="color:var(--color-text-secondary);font-size:9px">${20*3*filteredIndices.length}</td>`;
  mat.appendChild(totRow);
}

function getFilteredIndices(){
  const b=document.getElementById('batchSel').value;
  return stories.map((_,i)=>i).filter(i=>b==='all'||stories[i][1]===b);
}

function init(){
  const sel=document.getElementById('storySel');
  stories.forEach((s,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=s[0];
    sel.appendChild(o);
  });

  document.getElementById('batchSel').addEventListener('change',()=>{
    buildTable(getFilteredIndices());
  });

  document.getElementById('storySel').addEventListener('change',e=>{
    const idx=e.target.value;
    if(!idx) return;
    const cells=document.querySelectorAll(`td[title^="${stories[idx][0]}"]`);
    cells.forEach(c=>c.style.outline='2px solid #D85A30');
    setTimeout(()=>cells.forEach(c=>c.style.outline=''),2500);
  });

  buildTable(getFilteredIndices());
}
init();
</script>
